name = "deskl-ink-api"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Keep the *.workers.dev URL live alongside the custom domain (declaring `routes`
# defaults workers_dev to false — keep it explicitly true so nothing goes dark).
workers_dev = true

# Custom domain — the product lives at deskl.ink. The zone is active in this account,
# so CF provisions the proxied DNS record + TLS cert on deploy.
routes = [
  { pattern = "deskl.ink", custom_domain = true },
  { pattern = "www.deskl.ink", custom_domain = true },
]

[observability]
enabled = true

# Serve the web SPA (homepage overlay + desktop manager + fullscreen VNC route) from THIS
# same Worker → single origin, so the SPA's /api/* calls, the cookie, and the noVNC iframe
# are all same-origin. /api/* runs the Worker first; every other path serves the built SPA
# with client-side-routing fallback to index.html.
[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---------------------------------------------------------------------------
# Desktop control-plane: Containers + Durable Objects (Milestone 1 live).
#
# DesktopContainer = one container-enabled DO per live desktop, running the
#   Ubuntu workstation image; serves websockify/VNC on VNC_CONTAINER_PORT.
# DesktopRegistry  = one SQLite DO holding the authoritative desktop list.
#
# Prereqs to actually spin a container: Docker daemon running locally for the
# image build, a Workers PAID plan (Containers are paid-tier only), and the
# container/ubuntu/Dockerfile present. Set the signing secret with
# `wrangler secret put VNC_TICKET_SECRET` before production.
# ---------------------------------------------------------------------------

# --- Containers: the Linux workstation images, one per selectable distro ---
# Ubuntu is the default/golden path (DesktopContainer). Fedora + Debian are
# additive variants — distinct DO classes so each binds to its own image.
[[containers]]
class_name = "DesktopContainer"
image = "../../container/ubuntu/Dockerfile"
instance_type = "standard-1"
max_instances = 25

[[containers]]
class_name = "FedoraDesktop"
image = "../../container/fedora/Dockerfile"
instance_type = "standard-1"
max_instances = 25

[[containers]]
class_name = "DebianDesktop"
image = "../../container/debian/Dockerfile"
instance_type = "standard-1"
max_instances = 25

# --- Durable Objects ---
[[durable_objects.bindings]]
name = "DESKTOP"
class_name = "DesktopContainer"

[[durable_objects.bindings]]
name = "DESKTOP_FEDORA"
class_name = "FedoraDesktop"

[[durable_objects.bindings]]
name = "DESKTOP_DEBIAN"
class_name = "DebianDesktop"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "DesktopRegistry"

# --- Migrations: container DOs + the registry both require SQLite storage ---
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DesktopContainer", "DesktopRegistry"]

# v2: the additive per-distro container DOs (Ubuntu's v1 class is untouched).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["FedoraDesktop", "DebianDesktop"]


name = "deskl-ink-api"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Keep the *.workers.dev URL live alongside the custom domain (declaring `routes`
# defaults workers_dev to false — keep it explicitly true so nothing goes dark).
workers_dev = true

# Custom domain — the product lives at deskl.ink. The zone is active in this account,
# so CF provisions the proxied DNS record + TLS cert on deploy.
routes = [
  { pattern = "deskl.ink", custom_domain = true },
  { pattern = "www.deskl.ink", custom_domain = true },
]

[observability]
enabled = true

# Non-secret config. Secrets (AUTH_SECRET, GOOGLE_/GITHUB_ client id+secret, AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, TEST_LOGIN_SECRET) are set via `wrangler secret put` from get-secret —
# never committed.
[vars]
APP_URL = "https://deskl.ink"
# Email is sent via Amazon SES (the sole transactional rail). deskl.ink is a verified SES domain
# identity (EasyDKIM) in SES_REGION, so magic links send from @deskl.ink directly to ANY recipient.
EMAIL_FROM = "deskl.ink <login@deskl.ink>"
SES_REGION = "us-east-1"

# Serve the web SPA (homepage overlay + desktop manager + fullscreen VNC route) from THIS
# same Worker → single origin, so the SPA's /api/* calls, the cookie, and the noVNC iframe
# are all same-origin. /api/* runs the Worker first; every other path serves the built SPA
# with client-side-routing fallback to index.html.
[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---------------------------------------------------------------------------
# Desktop control-plane: Containers + Durable Objects (Milestone 1 live).
#
# DesktopContainer = one container-enabled DO per live desktop, running the
#   Ubuntu workstation image; serves websockify/VNC on VNC_CONTAINER_PORT.
# DesktopRegistry  = one SQLite DO holding the authoritative desktop list.
#
# Prereqs to actually spin a container: Docker daemon running locally for the
# image build, a Workers PAID plan (Containers are paid-tier only), and the
# container/ubuntu/Dockerfile present. Set the signing secret with
# `wrangler secret put VNC_TICKET_SECRET` before production.
# ---------------------------------------------------------------------------

# --- Containers: the Linux workstation images, one per selectable distro ---
# Ubuntu is the default/golden path (DesktopContainer). Fedora + Debian are
# additive variants — distinct DO classes so each binds to its own image.
[[containers]]
class_name = "DesktopContainer"
image = "../../container/ubuntu/Dockerfile"
instance_type = "standard-1"
max_instances = 25

[[containers]]
class_name = "FedoraDesktop"
image = "../../container/fedora/Dockerfile"
instance_type = "standard-1"
max_instances = 25

[[containers]]
class_name = "DebianDesktop"
image = "../../container/debian/Dockerfile"
instance_type = "standard-1"
max_instances = 25

# --- Per-SIZE containers: same 3 images, larger instance_types ---
# developer = standard-2 (6 GiB) · power = standard-3 (8 GiB) · heavy = standard-4 (12 GiB).
# Same Dockerfile per distro → same image digest as the everyday row (no extra build/push);
# a distinct class_name is required only because instance_type is fixed per class.
[[containers]]
class_name = "UbuntuDeveloper"
image = "../../container/ubuntu/Dockerfile"
instance_type = "standard-2"
max_instances = 10
[[containers]]
class_name = "UbuntuPower"
image = "../../container/ubuntu/Dockerfile"
instance_type = "standard-3"
max_instances = 6
[[containers]]
class_name = "UbuntuHeavy"
image = "../../container/ubuntu/Dockerfile"
instance_type = "standard-4"
max_instances = 4

[[containers]]
class_name = "FedoraDeveloper"
image = "../../container/fedora/Dockerfile"
instance_type = "standard-2"
max_instances = 10
[[containers]]
class_name = "FedoraPower"
image = "../../container/fedora/Dockerfile"
instance_type = "standard-3"
max_instances = 6
[[containers]]
class_name = "FedoraHeavy"
image = "../../container/fedora/Dockerfile"
instance_type = "standard-4"
max_instances = 4

[[containers]]
class_name = "DebianDeveloper"
image = "../../container/debian/Dockerfile"
instance_type = "standard-2"
max_instances = 10
[[containers]]
class_name = "DebianPower"
image = "../../container/debian/Dockerfile"
instance_type = "standard-3"
max_instances = 6
[[containers]]
class_name = "DebianHeavy"
image = "../../container/debian/Dockerfile"
instance_type = "standard-4"
max_instances = 4

# --- Server form: Ubuntu headless (ttyd, no desktop/VNC) — the LEAN server image ---
# everyday size (standard-1) for v1; more server sizes are additive classes later.
[[containers]]
class_name = "UbuntuServer"
image = "../../container/ubuntu-server/Dockerfile"
instance_type = "standard-1"
max_instances = 10
[[containers]]
class_name = "FedoraServer"
image = "../../container/fedora-server/Dockerfile"
instance_type = "standard-1"
max_instances = 10
[[containers]]
class_name = "DebianServer"
image = "../../container/debian-server/Dockerfile"
instance_type = "standard-1"
max_instances = 10

# --- Computer: the UNIVERSAL durable_object-policy container app (the LIVE create path) ---
# ONE class picks its image (from the `images` map) + instance size per-instance AT RUNTIME via
# `ctx.container.start({ image, instance, ... })`. This supersedes the 12 default-policy classes
# above (collapsing distro × size into data), and is the foundation for server form, version
# selection, and snapshot restore. `max_instances` is NOT supported with durable_object policy.
# See docs/adr/0002-durable-object-container-policy.md.
[[containers]]
class_name = "Computer"
scheduling_policy = "durable_object"
images = { "ubuntu-desktop" = { dockerfile = "../../container/ubuntu/Dockerfile" }, "fedora-desktop" = { dockerfile = "../../container/fedora/Dockerfile" }, "debian-desktop" = { dockerfile = "../../container/debian/Dockerfile" } }

# --- Durable Objects ---
[[durable_objects.bindings]]
name = "DESKTOP"
class_name = "DesktopContainer"

# The universal computer DO (durable_object policy) — the live create path.
[[durable_objects.bindings]]
name = "COMPUTER"
class_name = "Computer"

[[durable_objects.bindings]]
name = "DESKTOP_FEDORA"
class_name = "FedoraDesktop"

[[durable_objects.bindings]]
name = "DESKTOP_DEBIAN"
class_name = "DebianDesktop"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "DesktopRegistry"

# Per-size DO bindings (developer/power/heavy × each distro).
[[durable_objects.bindings]]
name = "DESKTOP_UBUNTU_DEVELOPER"
class_name = "UbuntuDeveloper"
[[durable_objects.bindings]]
name = "DESKTOP_UBUNTU_POWER"
class_name = "UbuntuPower"
[[durable_objects.bindings]]
name = "DESKTOP_UBUNTU_HEAVY"
class_name = "UbuntuHeavy"
[[durable_objects.bindings]]
name = "DESKTOP_FEDORA_DEVELOPER"
class_name = "FedoraDeveloper"
[[durable_objects.bindings]]
name = "DESKTOP_FEDORA_POWER"
class_name = "FedoraPower"
[[durable_objects.bindings]]
name = "DESKTOP_FEDORA_HEAVY"
class_name = "FedoraHeavy"
[[durable_objects.bindings]]
name = "DESKTOP_DEBIAN_DEVELOPER"
class_name = "DebianDeveloper"
[[durable_objects.bindings]]
name = "DESKTOP_DEBIAN_POWER"
class_name = "DebianPower"
[[durable_objects.bindings]]
name = "DESKTOP_DEBIAN_HEAVY"
class_name = "DebianHeavy"
[[durable_objects.bindings]]
name = "DESKTOP_UBUNTU_SERVER"
class_name = "UbuntuServer"
[[durable_objects.bindings]]
name = "DESKTOP_FEDORA_SERVER"
class_name = "FedoraServer"
[[durable_objects.bindings]]
name = "DESKTOP_DEBIAN_SERVER"
class_name = "DebianServer"

# --- Migrations: container DOs + the registry both require SQLite storage ---
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DesktopContainer", "DesktopRegistry"]

# v2: the additive per-distro container DOs (Ubuntu's v1 class is untouched).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["FedoraDesktop", "DebianDesktop"]

# v3: the additive per-SIZE container DOs (developer/power/heavy × each distro).
# Purely additive — the everyday v1/v2 classes are untouched, so the golden path
# (ubuntu/everyday) is unaffected.
[[migrations]]
tag = "v3"
new_sqlite_classes = [
  "UbuntuDeveloper",
  "UbuntuPower",
  "UbuntuHeavy",
  "FedoraDeveloper",
  "FedoraPower",
  "FedoraHeavy",
  "DebianDeveloper",
  "DebianPower",
  "DebianHeavy",
]

# v4: the universal `Computer` DO (durable_object scheduling policy). Additive — none of the
# v1/v2/v3 classes change, so a revert is just removing this class + flipping routing back.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["Computer"]

# v5: the headless server-form class (additive — the desktop classes are untouched).
[[migrations]]
tag = "v5"
new_sqlite_classes = ["UbuntuServer"]

# v6: Fedora/Debian server-form classes (additive).
[[migrations]]
tag = "v6"
new_sqlite_classes = ["FedoraServer", "DebianServer"]

# ---------------------------------------------------------------------------
# Bindings below are STAGED for later milestones (D1 + R2). Uncomment + fill
# ids (via `wrangler d1/r2 create`) as each lands. Do NOT hardcode account ids
# here — Wrangler reads CLOUDFLARE_ACCOUNT_ID from the environment.
# ---------------------------------------------------------------------------

# --- D1: primary relational store (users, desktops, sessions, usage) ---
# [[d1_databases]]
# binding = "DB"
# database_name = "deskl-ink"
# database_id = "TODO-run: wrangler d1 create deskl-ink"

# --- R2: object storage buckets ---
# BACKUPS is LIVE: durable truth for the home volume (P0 "never destroy user work"). The DO streams
# a gzip tar of /home ↔ this bucket so a desktop survives an actual container replacement; no R2
# credential ever enters the tenant container. Bucket already provisioned (deskl-ink-backups).
[[r2_buckets]]
binding = "BACKUPS"          # persisted desktop home-volume snapshots
bucket_name = "deskl-ink-backups"


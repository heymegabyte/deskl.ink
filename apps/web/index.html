<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060A" />
    <meta name="color-scheme" content="dark" />
    <title>deskl.ink — a desktop for you, a computer for your AI</title>
    <meta
      name="description"
      content="Instantly available, browser-accessible Linux workstations operable by humans and AI agents. Cloudflare-native."
    />
    <link rel="canonical" href="https://deskl.ink/" />

    <!-- Brand mark / favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Installable PWA (manifest-only — no SW required for install; offline SW is a follow-up).
         iOS A2HS uses apple-touch-icon + the apple-mobile-web-app meta below (Safari ignores manifest icons). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="deskl.ink" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="deskl.ink" />
    <meta property="og:url" content="https://deskl.ink" />
    <meta property="og:title" content="deskl.ink — a desktop for you, a computer for your AI" />
    <meta
      property="og:description"
      content="Instantly available, browser-accessible Linux workstations operable by humans and AI agents. Cloudflare-native."
    />
    <meta property="og:image" content="https://deskl.ink/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="deskl.ink — a desktop for you, a computer for your AI" />
    <meta name="twitter:image" content="https://deskl.ink/og.png" />

    <!-- Self-hosted fonts (no Google origin — see src/fonts.css). Preload the two above-the-fold
         faces: Space Grotesk 400 (body) + Sora 800 (headings/wordmark) so first paint isn't FOUT. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-400.woff2"
      crossorigin
    />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/sora-800.woff2" crossorigin />

    <!-- Structured data (accurate types only — no fabricated pricing/ratings). A non-JS MIME data
         block: not executed, so the strict CSP script-src 'self' does not apply to it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://deskl.ink/#website",
            "url": "https://deskl.ink/",
            "name": "deskl.ink",
            "description": "Instantly available, browser-accessible Linux workstations operable by humans and AI agents."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://deskl.ink/#app",
            "name": "deskl.ink",
            "url": "https://deskl.ink/",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "Requires a modern web browser",
            "description": "A desktop for you. A computer for your AI. Browser-accessible Linux workstations (Ubuntu, Fedora, Debian) operable by people and AI agents — boots in seconds, scales to zero when idle.",
            "featureList": [
              "Browser-accessible Linux workstations",
              "Desktop (GUI over VNC) or headless Server form",
              "Operable by humans and AI agents",
              "In-session browser terminal",
              "Installable PWA with offline shell"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
